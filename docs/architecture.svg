<text class="sgt" x="78" y="477" dominant-baseline="central">Added by Karpenter</text>
<g class="c-coral" data-f="traffic nodes pods"><rect x="76" y="490" width="74" height="26" rx="4" stroke-width="0.6" stroke-dasharray="3 3"/><text class="ts" x="113" y="503" text-anchor="middle" dominant-baseline="central">nginx</text></g>
<g class="c-coral" data-f="traffic nodes pods"><rect x="156" y="490" width="74" height="26" rx="4" stroke-width="0.6" stroke-dasharray="3 3"/><text class="ts" x="193" y="503" text-anchor="middle" dominant-baseline="central">nginx</text></g>
<g class="c-gray" data-f="logs nodes"><rect x="76" y="522" width="74" height="26" rx="4" stroke-width="0.6" stroke-dasharray="3 3"/><text class="ts" x="113" y="535" text-anchor="middle" dominant-baseline="central">fluent-bit</text></g>

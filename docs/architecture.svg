<text class="th" x="153" y="594" text-anchor="middle" dominant-baseline="central">Public subnet, AZ a</text>
<text class="ts" x="361" y="578" text-anchor="middle" dominant-baseline="central" data-f="net">Route 0.0.0.0/0 to IGW</text>
<text class="th" x="361" y="594" text-anchor="middle" dominant-baseline="central">Public subnet, AZ b</text>


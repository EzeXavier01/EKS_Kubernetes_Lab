<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 656" role="img" aria-label="EKS architecture diagram"><style>
svg{
  --bg:#ffffff; --text:#1f1e1d; --muted:#5f5e5a; --line:#888780; --soft:#b4b2a9;
  --box-f:#f7f6f2; --box-s:#888780;
  --coral-f:#FAECE7; --coral-s:#993C1D; --coral-t:#712B13;
  --gray-f:#F1EFE8; --gray-s:#5F5E5A; --gray-t:#444441;
  --purple-f:#EEEDFE; --purple-s:#534AB7; --purple-t:#3C3489;
  --sg:#BA7517; --sg-t:#854F0B;
  --accent:#185FA5; --accent-bg:#E6F1FB; --flow:#D85A30;
}

body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--soft);background:transparent;color:var(--text);cursor:pointer}
button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
svg{width:100%;height:auto;display:block}
.th{font-size:14px;font-weight:500;fill:var(--text)}
.ts{font-size:12px;fill:var(--muted)}
.box{fill:var(--box-f);stroke:var(--box-s)}
.c-coral rect{fill:var(--coral-f);stroke:var(--coral-s)} .c-coral text{fill:var(--coral-t)}
.c-gray rect{fill:var(--gray-f);stroke:var(--gray-s)} .c-gray text{fill:var(--gray-t)}
.c-purple rect{fill:var(--purple-f);stroke:var(--purple-s)} .c-purple .th{fill:var(--purple-t)} .c-purple .ts{fill:var(--purple-t);opacity:.85}
.sg{fill:none;stroke:var(--sg);stroke-width:1.2;stroke-dasharray:6 3}
.sgt{font-size:12px;fill:var(--sg-t)}
.nacl rect{fill:var(--gray-f);stroke:var(--gray-s);stroke-width:.6}
.nacl text{font-size:12px;fill:var(--gray-t)}
.fl{fill:none;stroke:var(--line);stroke-width:1}
.fl.flow{stroke:var(--flow);stroke-width:2;stroke-dasharray:6 4}
[data-f]{transition:opacity .3s}

@keyframes dash{to{stroke-dashoffset:-20}}
#cap{font-size:15px;color:var(--muted);line-height:1.6;min-height:76px;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g data-f="traffic ctl"><rect class="box" x="40" y="24" width="170" height="52" rx="8" stroke-width="0.6"/>
<text class="th" x="125" y="42" text-anchor="middle" dominant-baseline="central">Your laptop</text>
<text class="ts" x="125" y="61" text-anchor="middle" dominant-baseline="central">k6 load test, kubectl</text></g>

<rect x="20" y="100" width="640" height="540" rx="16" fill="none" stroke="var(--soft)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="th" x="36" y="120" dominant-baseline="central">AWS region eu-north-1</text>

<rect x="40" y="132" width="432" height="490" rx="12" fill="none" stroke="var(--line)" stroke-width="0.8"/>
<text class="th" x="56" y="154" dominant-baseline="central">VPC 10.0.0.0/16</text>
<text class="ts" x="456" y="154" text-anchor="end" dominant-baseline="central" data-f="net">No NAT gateway, no private subnets</text>
<text class="ts" x="556" y="152" text-anchor="middle" dominant-baseline="central">Outside your VPC</text>

<g data-f="traffic net"><rect class="box" x="230" y="114" width="150" height="36" rx="6" stroke-width="0.6"/>
<text class="th" x="305" y="132" text-anchor="middle" dominant-baseline="central">Internet gateway</text></g>


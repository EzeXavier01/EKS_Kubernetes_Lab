<text class="sgt" x="312" y="241" text-anchor="middle" dominant-baseline="central">sg-lb: port 80 open</text></g>
<g data-f="traffic"><rect class="box" x="100" y="178" width="310" height="50" rx="8" stroke-width="0.6"/>
<text class="th" x="255" y="195" text-anchor="middle" dominant-baseline="central">Load balancer (NLB)</text>
<text class="ts" x="255" y="213" text-anchor="middle" dominant-baseline="central">nginx Service, type LoadBalancer</text></g>

<rect x="54" y="270" width="198" height="336" rx="10" fill="none" stroke="var(--line)" stroke-width="0.6" stroke-dasharray="3 3"/>
<rect x="262" y="270" width="198" height="336" rx="10" fill="none" stroke="var(--line)" stroke-width="0.6" stroke-dasharray="3 3"/>

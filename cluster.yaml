apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nginx-lab
  region: eu-north-1

vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Disable        
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: base
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: false   
